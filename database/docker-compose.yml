services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: barberappointment-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-BarberApp_Dev1!}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - barberappointment-sql-data:/var/opt/mssql
      - ./mssql:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 25s

volumes:
  barberappointment-sql-data:
